name: ci
on:
  push:
  pull_request:

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: No game-derived or private files
        run: python -I tools/check_clean.py

  # The portable core on every host we care about: Windows x64, Linux x64, Linux arm64 and Apple Silicon macOS (arm64 is the iOS architecture; it uses
  # sse2neon for the SSE/MMX helpers, and macOS exercises the same Apple toolchain and POSIX paths as iOS).
  build:
    needs: hygiene
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-latest }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
          - { name: windows-x64, os: windows-latest }
          - { name: macos-arm64, os: macos-14 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Vulkan headers
        shell: bash
        run: git clone --depth 1 --branch v1.3.280 https://github.com/KhronosGroup/Vulkan-Headers.git "$RUNNER_TEMP/vk-headers"
      - name: sse2neon (arm64 only)
        if: matrix.name == 'linux-arm64' || matrix.name == 'macos-arm64'
        shell: bash
        run: git clone --depth 1 --branch v1.8.0 https://github.com/DLTcollab/sse2neon.git "$RUNNER_TEMP/sse2neon"
      - name: Configure
        shell: bash
        run: |
          extra=""
          if [ "${{ matrix.name }}" = "linux-arm64" ] || [ "${{ matrix.name }}" = "macos-arm64" ]; then extra="-DSSE2NEON_DIR=$RUNNER_TEMP/sse2neon"; fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVULKAN_HEADERS_DIR="$RUNNER_TEMP/vk-headers/include" $extra
          echo "CMAKE_EXTRA=-DVULKAN_HEADERS_DIR=$RUNNER_TEMP/vk-headers/include $extra" >> "$GITHUB_ENV"
          if [ -n "$extra" ]; then echo "SSE2NEON_DIR=$RUNNER_TEMP/sse2neon" >> "$GITHUB_ENV"; fi
      - name: Build
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake --build build --config Release --parallel
          else
            # keep going after the first error so one run shows every problem, and surface them as one annotation
            set +e
            cmake --build build --parallel -- -k 2>&1 | tee build.log
            rc=${PIPESTATUS[0]}
            if [ $rc -ne 0 ]; then
              msg=$(grep -E "error|undefined reference|Error [0-9]" build.log | head -150 | cut -c1-260 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
              echo "::error title=build errors (${{ matrix.name }})::$msg"
            fi
            exit $rc
          fi
      - name: Platform layer tests
        shell: bash
        run: ctest --test-dir build --output-on-failure -C Release
      - name: Smoke test (the runtime starts and fails cleanly without a game)
        shell: bash
        run: |
          exe=build/reforged
          if [ -f build/Release/reforged.exe ]; then exe=build/Release/reforged.exe; fi
          set +e
          T=""; if command -v timeout >/dev/null 2>&1; then T="timeout 60"; fi   # macOS runners have no timeout
          $T "$exe" none none 2 > smoke.log 2>&1
          rc=$?
          cat smoke.log
          echo "exit code: $rc"
          if grep -q "guest address space" smoke.log && grep -q "XBE load failed" smoke.log && [ $rc -eq 1 ]; then exit 0; fi
          msg=$(head -c 6000 smoke.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=smoke test output (exit $rc)::$msg"
          exit 1
      - name: Translator end-to-end (generate a test program, translate it, build it into the runtime, run it)
        shell: bash
        run: |
          set +e
          bash tests/lift_e2e.sh > e2e.log 2>&1
          rc=$?
          cat e2e.log
          if [ $rc -ne 0 ]; then
            msg=$( (grep -E "error|MISMATCH|Traceback|FAIL|fatal|[Uu]ndefined|Assertion" e2e.log | grep -v "Wdeprecated\|warning:" | head -40 | cut -c1-300; echo ----; tail -c 2500 e2e.log) | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=translator end-to-end failed::$msg"
          fi
          exit $rc

  # The iOS game module built with a plain LLVM toolchain on a non-Apple machine (no SDK): the build the companion tool performs on the user's computer.
  ios-module-cross:
    needs: hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Toolchain (clang + lld)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang lld llvm
      - name: sse2neon
        run: git clone --depth 1 --branch v1.8.0 https://github.com/DLTcollab/sse2neon.git "$RUNNER_TEMP/sse2neon"
      - name: Build and inspect the iOS module
        shell: bash
        run: |
          set +e
          export SSE2NEON_DIR="$RUNNER_TEMP/sse2neon"
          bash tests/ios_module_cross.sh > ios.log 2>&1
          rc=$?
          cat ios.log
          if [ $rc -ne 0 ]; then
            msg=$( (grep -E "error|FAILED|UNEXPECTED|not |Traceback|failed" ios.log | head -40 | cut -c1-300; echo ----; tail -c 2500 ios.log) | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=ios module cross build failed::$msg"
          fi
          exit $rc

  # The iOS app: built for a device (unsigned IPA) and for the Simulator, where it is installed, launched and checked.
  ios-app:
    needs: hygiene
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Vulkan headers and sse2neon
        run: |
          git clone --depth 1 --branch v1.3.280 https://github.com/KhronosGroup/Vulkan-Headers.git "$RUNNER_TEMP/vk-headers"
          git clone --depth 1 --branch v1.8.0 https://github.com/DLTcollab/sse2neon.git "$RUNNER_TEMP/sse2neon"
      - name: What the MoltenVK iOS package contains
        shell: bash
        run: |
          curl -sL -o "$RUNNER_TEMP/MoltenVK-ios.tar" https://github.com/KhronosGroup/MoltenVK/releases/download/v1.4.2/MoltenVK-ios.tar
          shasum -a 256 "$RUNNER_TEMP/MoltenVK-ios.tar"
          list=$(tar -tf "$RUNNER_TEMP/MoltenVK-ios.tar" | grep -iE "dylib|\.a$|xcframework/[^/]+/$|Info.plist|LICENSE" | head -40 | awk '{printf "%s%%0A", $0}')
          echo "::notice title=MoltenVK iOS package::$list"
      - name: Build, package and run in the Simulator
        shell: bash
        run: |
          set +e
          export SSE2NEON_DIR="$RUNNER_TEMP/sse2neon" VULKAN_HEADERS_DIR="$RUNNER_TEMP/vk-headers/include"
          bash tests/ios_app.sh > ios_app.log 2>&1
          rc=$?
          tail -c 20000 ios_app.log
          if [ $rc -ne 0 ]; then
            msg=$( (sed -n '/=== run in the simulator/,$p' ios_app.log | cut -c1-260 | head -70; echo ----; grep -E "error:|FAILED|not |Traceback|failed" ios_app.log | grep -v "warning:" | head -12 | cut -c1-260) | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=ios app failed::$msg"
          fi
          exit $rc
      - name: Keep the unsigned IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Reforged-unsigned-ipa
          path: Reforged-unsigned.ipa
          if-no-files-found: ignore

